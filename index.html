<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Evaluación de Formación - Somos Zeta</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root { --purple: #7030a0; --blue: #1c89af; --dark: #2d2b2c; --gray: #f8f9fc; }
    body { font-family: 'DM Sans', sans-serif; background: var(--gray); color: var(--dark); margin: 0; padding: 20px; }
    .container { max-width: 600px; margin: 40px auto; background: white; padding: 40px 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    .header { text-align: center; margin-bottom: 30px; }
    .logo { max-height: 80px; margin-bottom: 15px; }
    h1 { font-size: 1.6rem; color: var(--dark); margin: 0; }
    p.subtitle { color: #64748b; font-size: 0.95rem; margin-top: 5px; }
    .form-group { margin-bottom: 22px; }
    label { display: block; font-weight: 700; margin-bottom: 8px; font-size: 0.95rem; }
    input, select, textarea { width: 100%; padding: 14px; border: 2px solid #e2e8f0; border-radius: 8px; box-sizing: border-box; font-size: 1rem; font-family: 'DM Sans', sans-serif; }
    input:focus, select:focus, textarea:focus { border-color: var(--purple); outline: none; background: #faf5ff; }
    .btn { background: var(--purple); color: white; border: none; padding: 16px; width: 100%; border-radius: 8px; font-weight: 700; font-size: 1.05rem; cursor: pointer; transition: 0.3s; margin-top: 10px; }
    .btn:hover { background: #5a2682; transform: translateY(-2px); }
    .btn:disabled { background: #94a3b8; cursor: not-allowed; transform: none; }
    #msg { margin-top: 20px; padding: 20px; border-radius: 8px; display: none; text-align: center; line-height: 1.6; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <img src="https://i.ibb.co/Z1VMrwZj/Somos-Zeta-Exportar-Mesa-de-trabajo-1-copia-3.png" class="logo" alt="Somos Zeta">
    <h1>Evaluación de Capacitación</h1>
    <p class="subtitle">Completá este formulario para recibir tu certificado oficial.</p>
  </div>

  <div id="formContainer">
    <div class="form-group">
      <label>Nombre y Apellido</label>
      <input type="text" id="nombre" placeholder="Ej: Mauro García">
    </div>

    <div class="form-group">
      <label>Correo Electrónico</label>
      <input type="email" id="email" placeholder="El mail donde recibiste la invitación">
    </div>

    <div class="form-group">
      <label>¿Qué módulo cursaste?</label>
      <select id="modulo">
        <option value="" disabled selected>Seleccioná el módulo...</option>
        <option value="Módulo 1: Introducción y Mapa de Impacto">Módulo 1: Introducción y Mapa de Impacto</option>
        <option value="Módulo 2: Herramientas e Investigación">Módulo 2: Herramientas e Investigación</option>
        <option value="Módulo 3: Asistentes y Chatbots">Módulo 3: Asistentes y Chatbots</option>
        <option value="Módulo 4: Automatización y Adopción">Módulo 4: Automatización y Adopción</option>
      </select>
    </div>

    <div class="form-group">
      <label>¿Qué fue lo más valioso que aprendiste hoy?</label>
      <textarea id="feedback" rows="3" placeholder="Contanos brevemente tu experiencia..."></textarea>
    </div>

    <button class="btn" id="btnSubmit" onclick="enviar()">Enviar y Recibir Certificado</button>
  </div>

  <div id="msg"></div>
</div>

<script>
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwI83MqFPYJAJVSqPDCaI7xd5Rm3wr419_1a9jH70jsQgPcdxXDEreCleEx9YR0E0t0nw/exec';

  async function enviar() {
    const btn = document.getElementById('btnSubmit');
    const msg = document.getElementById('msg');
    const data = {
      nombre: document.getElementById('nombre').value.trim(),
      email: document.getElementById('email').value.trim(),
      modulo: document.getElementById('modulo').value,
      feedback: document.getElementById('feedback').value.trim()
    };

    if (!data.nombre || !data.email || !data.modulo) {
      alert('Te faltó completar algún campo clave, Leo.');
      return;
    }

    btn.disabled = true;
    btn.innerText = 'Generando certificado... ⏳';

    try {
      await fetch(SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify(data),
        mode: 'no-cors' 
      });
      
      document.getElementById('formContainer').style.display = 'none';
      msg.style.display = 'block';
      msg.style.background = '#e8f5e9';
      msg.style.color = '#2e7d32';
      msg.innerHTML = '<strong>¡Listo!</strong> En unos minutos te llega el PDF al mail.<br>Si no lo ves, chequeá Spam.';
    } catch (e) {
      btn.disabled = false;
      btn.innerText = 'Enviar y Recibir Certificado';
      alert('Se cortó el cable. Reintentá en un ratito.');
    }
  }
</script>

</body>
</html>
